# bz/conf/pgbouncer/ro/pgbouncer.ini — READ PROXY
# ─────────────────────────────────────────────────────────────────────────────
# Reads that tolerate replication lag connect here, and are spread across
# EVERY node in the cluster. Published on the host as ${HOST_PORT_PROXY_RO}
# (default 6434).
#
# HOW THE SPREAD HAPPENS
#   `host=` below is a COMMA-SEPARATED LIST, not one host. PgBouncer opens a new
#   server connection to the next entry in the list each time one is needed —
#   round-robin by default. `load_balance_hosts = round-robin` states that
#   explicitly rather than relying on the default, so a future default change
#   cannot silently turn this into failover-only behaviour.
#     - add a node  → append it to the list. Nothing else to change.
#     - remove one → delete it from the list, then RELOAD / restart.
#   Both properties require PgBouncer >= 1.24.0 (1.17.0 introduced the host
#   list; 1.24.0 added load_balance_hosts). The pinned image is 1.26.0.
#
# SAME CREDENTIALS AS THE WRITE ENDPOINT — this is the whole point of the forced server user
#   The application uses ONE user (bz_app) and ONE password, and that exact
#   credential works on BOTH proxies. It does not need a second login, a second
#   role, or a second DSN user field.
#
#   `user = bz_ro` makes every SERVER-side connection on this pool run as
#   bz_ro, whatever the client authenticated as. So the app logs in as bz_app and
#   the database still sees bz_ro — which cannot write.
#
#   That is strictly better than the earlier arrangement where the app role was
#   simply absent from this proxy's auth file. That approach required the app to
#   know it had a different identity per endpoint, which is exactly the kind of
#   thing that silently breaks when someone copies a DSN. Here the DSN is the
#   same and only the port differs.
#
# WHAT THE READ PROXY DOES *NOT* DO
#   It does not know a statement is a read. A write arriving on this port is
#   balanced across the list like anything else, so ~half of them land on the
#   standby. What stops them is the forced read-only role, locked twice over:
#
#     1. It has no INSERT/UPDATE/DELETE grant on any table — the privilege is
#        simply absent, so a write cannot succeed on ANY node.
#     2. It carries `ALTER ROLE bz_ro SET default_transaction_read_only = on`,
#        so every session it opens starts read-only, and the standby would refuse
#        the write on its own even if (1) were somehow granted.
#
#   Either lock alone would do; together they mean an accidental write on this
#   port fails identically on every node instead of failing only when it happens
#   to land on the standby. A deterministic error beats a coin-flip one.
#
#   NOTE: `options = -c default_transaction_read_only=on` on this database line
#   was the first attempt at (2) and DOES NOT WORK — PgBouncer 1.26 rejects it at
#   config load with "unrecognized connection parameter: options", and the
#   container exits without ever listening. The forced role is the portable
#   mechanism, and it is enforced by PostgreSQL rather than by the proxy.
#
#   Read path only: point read traffic here. The port is what differs from the
#   write endpoint, not the credentials.
# ─────────────────────────────────────────────────────────────────────────────
[databases]
bzdb_ro = host=bz-pg-primary,bz-pg-replica port=5432 dbname=bzdb user=bz_ro pool_mode=transaction load_balance_hosts=round-robin

# `user = bz_ro` is what makes the SAME client login read-only here. It is scoped
# to this database entry, so it cannot affect the write proxy.
#
# NOTE THE KEY NAME: it is `user`, NOT `force_user`. PgBouncer has no force_user
# setting; the first attempt failed at config load with
#     ERROR: unrecognized connection parameter: force_user
#     FATAL cannot load config file
# and the container never listened. `force_user` appears in SHOW DATABASES
# output as a COLUMN, which is what makes it look like a setting. The real
# [databases] keys are: dbname, host, port, user, password, auth_user,
# auth_query, auth_dbname, pool_size, min_pool_size, reserve_pool_size,
# connect_query, pool_mode, query_wait_timeout, load_balance_hosts,
# max_db_connections, max_db_client_connections, server_lifetime,
# client_encoding, datestyle, timezone.
#
# Side effect of `user=`, and a useful one here: "there will be only one pool for
# this database", so every reader shares one pool instead of one pool per client
# user.
#
# No wildcard entry, same reason as before.

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = plain
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
admin_users = pgbouncer

# auth_file exists to authenticate the CLIENT, and it must contain the app role —
# the application is not going to present a different password to this port. What
# it does not grant is anything on the server side: every connection opened here
# is forced to run as bz_ro (see [databases]).

# See rw/pgbouncer.ini for the full explanation of prepared statements.
max_prepared_statements = 100

max_client_conn = 1000
default_pool_size = 20
# min_pool_size is deliberately 0. It was briefly set to 2 here on the theory that
# two warm server connections would sit on two different nodes — MEASURED ON THIS
# STACK, that is not what happens: SHOW POOLS still reported sv_idle = 1, and eight
# sequential reads all landed on the primary. PgBouncer does not eagerly pre-warm
# one-connection-per-host. Left at 0 rather than carrying a value that does not do
# what its comment would claim.
min_pool_size = 0

# server_round_robin = 1 — reuse server connections in rotation instead of LIFO.
#
# THIS is the setting that makes multi-host balancing actually fair, and it is
# what PgBouncer's own FAQ recommends behind a load-balanced address ("idle
# connections are reused by a LIFO algorithm, which may work not so well when
# load-balancing is needed"). With LIFO, one warm connection takes almost all the
# traffic and the other sits idle; with rotation they share.
#
# IT DOES NOT, HOWEVER, CREATE CONNECTIONS. The honest statement of what this
# proxy does, measured on this stack:
#
#   * Reads are distributed per SERVER CONNECTION, not per query.
#   * 8 CONCURRENT readers → 4 queries on the primary, 4 on the replica. Balanced.
#   * 8 SEQUENTIAL readers → all 8 on one node. Serial traffic reuses the single
#     connection the pool already has, so it never advances the round-robin.
#
# That is PgBouncer's connection-reuse model, not a misconfiguration, and it is
# why "balanced across all nodes" is a statement about concurrent load. If you
# need even spread at low concurrency, server_lifetime below is the lever: every
# recycled connection is a new connection, and a new connection takes the next host
# in the list.
server_round_robin = 1

reserve_pool_size = 5
# Recycle server connections periodically. With host round-robin, each recycled
# connection lands on the next node — this is what stops a low-concurrency read
# path from pinning itself to one node indefinitely. 3600s is a conservative
# default; lower it (e.g. 300) if you want the rotation to be visible quickly.
server_lifetime = 3600
max_db_connections = 30
query_timeout = 30

server_reset_query = DISCARD ALL
server_reset_query_always = 0

# A standby replays asynchronously: a read served here can be behind the
# primary by up to the current replication lag. Check it with
#   SELECT * FROM pg_stat_replication;   -- on the primary
# See bz/README.md §5 for how to read that number and when it matters.
log_connections = 1
log_disconnections = 1
