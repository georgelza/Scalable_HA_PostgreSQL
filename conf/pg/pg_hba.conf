# conf/pg/pg_hba.conf — CORE Banking PostgreSQL host-based authentication
#
# All connections use scram-sha-256 — NO trust lines (the card8583 placeholder
# shipped `host all all 0.0.0.0/0 trust`, which bypassed ALL authentication; that
# line is removed here).
#
# Users (created in sql/postgresdb/postgres_init.sql):
#   core_admin   — database owner / admin
#   core_user    — application user (CORE, Kafka Connect JDBC Sink)
#   replicator   — streaming replication (repmgr standby, Citus secondary)
#
# TYPE  DATABASE        USER            ADDRESS                 METHOD
local   all             all                                     scram-sha-256
host    all             all             0.0.0.0/0               scram-sha-256
host    all             all             ::/0                    scram-sha-256

# Streaming replication (repmgr standby core1_pg_replica + Citus node comms)
host    replication     replicator      0.0.0.0/0               scram-sha-256
host    replication     replicator      ::/0                    scram-sha-256
