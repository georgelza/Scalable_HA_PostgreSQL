# bz/conf/pgpool2/pgpool.conf — THE WRITE ENDPOINT
# ─────────────────────────────────────────────────────────────────────────────
# This is the single endpoint the application uses for ALL DML. It is not a
# pooler in the PgBouncer sense: it exists because PgBouncer cannot tell a
# primary from a standby, and a round-robin host list would send writes to a
# read-only node about half the time.
#
# WHAT THIS FILE DOES, IN ONE PARAGRAPH
#   Pgpool-II health-checks every backend and, crucially, asks each one whether
#   it is in recovery. Exactly one node answers no; that node is the writer. When
#   that node stops answering, Pgpool-II runs failover_command, which promotes a
#   standby, and from then on the promoted node is the writer — with no operator
#   action, no config edit, and no client change. The application's connection
#   string never changes.
#
# THE INVARIANT THIS FILE ENFORCES
#   At most one backend is in status "primary". Everything else is "standby".
#   That is what makes "writes always land on the primary" true rather than
#   likely, and it is why the service healthcheck asserts exactly one primary
#   row exists (see docker-compose.yml).
#
# ⚠ PRIMARY/STANDBY IS DECIDED BY THE **SR CHECK**, NOT THE HEALTH CHECK.
#   This is the single most important thing in this file and it is easy to get
#   wrong, because the two checks sound interchangeable. They are not:
#
#     health_check_*  → is the node REACHABLE? (up / down)
#     sr_check_*      → is the node in RECOVERY? (primary / standby)
#
#   With sr_check_period = 0, SHOW POOL_NODES reported BOTH backends as
#   `role = standby, pg_role = unknown` — because with no replication check
#   Pgpool-II has no way to know which node is the writer, and "I don't know" is
#   not "assume primary". Writes then have no valid target. The health check was
#   passing the whole time, which is the dangerous part: a green healthcheck and
#   a write path with nowhere to go.
#
# RELATED: the READ endpoint is PgBouncer (conf/pgbouncer/ro/pgbouncer.ini), not
# this service. Reads do not need failover awareness — every node can serve them,
# and the read pool is deliberately dumb and spreadable across N nodes.
# ─────────────────────────────────────────────────────────────────────────────

# ══════════════════════════════════════════════════════════════════════════════
# BACKENDS — this is the list that scales
# ══════════════════════════════════════════════════════════════════════════════
# Adding a read node later is two lines here (backend_hostnameN + backend_portN).
# The write endpoint keeps exactly one primary regardless of how many standbys
# exist.
#
# backend_flag0 = 'ALLOW_TO_FAILOVER' marks the node as eligible to be promoted.
# Do NOT set it on a node you would never want to become the writer.
backend_hostname0 = 'bz-pg-primary'
backend_port0 = 5432
backend_weight0 = 1
backend_data_directory0 = '/var/lib/postgresql/data'
backend_flag0 = 'ALLOW_TO_FAILOVER'

backend_hostname1 = 'bz-pg-replica'
backend_port1 = 5432
backend_weight1 = 1
backend_data_directory1 = '/var/lib/postgresql/data'
backend_flag1 = 'ALLOW_TO_FAILOVER'

# ══════════════════════════════════════════════════════════════════════════════
# HEALTH CHECK — how "is this node alive AND is it the writer?" is decided
# ══════════════════════════════════════════════════════════════════════════════
# This is the load-bearing block. Pgpool-II's health check does not merely probe
# the port: it runs a query and reads whether the node is in recovery, which is
# how it distinguishes a standby (healthy, readable, NOT a writer) from a primary.
# Without it a standby looks identical to a primary and writes get sent to it.
health_check_period = 5
health_check_timeout = 10
health_check_user = 'bz_admin'
health_check_password = 'bz_admin_dev_pw'
health_check_database = 'bzdb'
# Retry a connection before declaring the node down. A single missed check during
# a restart is not a failover; without this, any brief blip promotes a standby.
health_check_max_retries = 3
health_check_retry_delay = 2

# ══════════════════════════════════════════════════════════════════════════════
# FAILOVER — the automatic part
# ══════════════════════════════════════════════════════════════════════════════
# %d = hostname of the node Pgpool-II has decided to promote
# %h = hostname of the OLD primary
#
# Promotion is done with `SELECT pg_promote()` from this container rather than by
# running pg_ctl on the far node (which would need SSH keys and a data directory
# we do not have). The command is idempotent: pg_promote() returns false,
# harmlessly, if the node is already out of recovery, so a retry cannot promote
# something twice.
# TEMPORARY DIAGNOSTIC — wrapper that records whether pgpool2 invoked this at all.
# %H, NOT %d/%h. THIS IS THE WHOLE FAILOVER.
#
# The placeholder semantics were measured on this stack by recording every one of
# them, because they are genuinely counter-intuitive — %d reads like "the node to
# promote" and is not:
#
#     %d  ->  0               the DETACHED (old primary) node id
#     %h  ->  bz-pg-primary   the DETACHED (old primary) host
#     %H  ->  bz-pg-replica   THE NEW PRIMARY's host   <-- the promotion target
#     %p  ->  5432            the detached node's port
#     %P  ->  0
#     %D  ->  /var/lib/postgresql/data   the detached node's data directory
#
# An earlier version used `%d %h`. That compiled, ran, exited 0, and promoted
# nothing — because it was asking Pgpool-II to promote the node that had just
# died. The signature was invisible: no error, no log line, writes just kept
# failing with "cannot execute INSERT in a read-only transaction" while the
# standby sat there perfectly promotable. If you ever change this line, the only
# proof it is right is a failover test, not a successful exit code.
failover_command = '/etc/pgpool2/failover.sh %H %h'

# Run failover_command again if the promoted node does not come up. Bounded: an
# unbounded retry loop turns one dead primary into a flapping writer.
failover_retries = 3
retry_delay = 5

# The old primary must not come back believing it is still the writer — that is
# split-brain. With two nodes there is nowhere to put it (it has diverged), so it
# is deliberately NOT set here; see README §6 for the rebuild procedure. Setting
# follow_primary_command without a way to actually demote-and-rewind the old
# primary would produce a second writer, which is worse than an outage.
#
# follow_primary_command = ''

# ══════════════════════════════════════════════════════════════════════════════
# CONNECTION POOLING
# ══════════════════════════════════════════════════════════════════════════════
listen_addresses = '*'
port = 6432
pcp_listen_addresses = ''
pcp_port = 9898

# Transaction pooling: a session is pinned to the primary for the duration of one
# transaction only. `session` pooling would pin a client to a node for its whole
# life — and after a failover that client would be stuck on the dead node.
pool_mode = transaction

# Connections and timeouts.
num_init_children = 100
max_client_conn = 1000
child_life_time = 300
child_max_connections = 0
connection_cache = 1

# Fail fast rather than queueing a write behind an unknown number of seconds.
query_timeout = 30
# How long a client may keep running in a transaction that pgpool2 considers
# stale. Left at 0 deliberately — a lab's ad-hoc psql sessions hold transactions
# open, and 300s would kill them.
client_idle_timeout = 0
client_idle_timeout_in_transaction = 0

# ══════════════════════════════════════════════════════════════════════════════
# AUTHENTICATION
# ══════════════════════════════════════════════════════════════════════════════
# pool_passwd is the credential file (same idea as PgBouncer's userlist, generated
# by ../scripts/gen_pgpool_passwd.sh). It is a SECRET — with plain-text passwords in
# it, that file holds every database password.
# scram-sha-256, NOT md5 — and this is not a preference.
#
# `auth_type` controls how Pgpool-II authenticates to the BACKEND as well as to
# the client. With md5, Pgpool-II sends an MD5 response; the PostgreSQL nodes here
# are configured for scram-sha-256 with no trust lines (pg_hba.conf), so the
# backend answers with an Error packet where Pgpool-II expects an auth request and
# every connection fails:
#     ERROR:  backend authentication failed
#     DETAIL:  backend response with kind 'E' when expecting 'R'
# The stack looks healthy — the listener is up, the admin console answers — and
# no query ever succeeds.
auth_type = scram-sha-256
enable_pool_hba = on
pool_passwd = '/etc/pgpool2/pool_passwd'
hba_file = '/etc/pgpool2/pool_hba.conf'

# Roles that may connect through this endpoint.
#
# NO `pgbouncer` HERE, and that is a correction rather than an omission. Pgpool-II
# has no separate admin-console identity the way PgBouncer does — the console is
# reached by connecting as a REAL PostgreSQL role, and a role Pgpool-II then uses
# to reach the backend. Listing the PgBouncer-only `pgbouncer` user made every
# console connection fail with:
#     ERROR:  backend authentication failed
#     DETAIL:  backend response with kind 'E' when expecting 'R'
# because there is no such role in PostgreSQL to authenticate as. Use bz_admin.
pool_users = 'bz_app, bz_admin'

# ══════════════════════════════════════════════════════════════════════════════
# LOGGING
# ══════════════════════════════════════════════════════════════════════════════
# NO pid_file SETTING HERE, ON PURPOSE.
#
# pgpool2 4.3.5 ignores it. Verified by setting it to /tmp/probe.pid on this
# image: pgpool2 still failed with
#     FATAL: could not open pid file "/var/run/postgresql/pgpool.pid"
# i.e. the compiled-in default is used regardless of what the file says. So
# rather than leave a setting in the config that looks effective and is not, the
# image chowns /var/run/postgresql to the pgpool user instead. See
# infrastructure/pgpool2/Dockerfile.
#
# Likewise ABSENT, because pgpool2 4.3.5 rejects them by name: log_stats,
# log_startup_progress_interval, stats_period, show_pool_id, show_maxwait (the
# last two arrived in 4.4). The failure mode is quiet — each is logged at INFO and
# parsing continues — so they were removed rather than left in to be ignored.

# LOG TO STDERR. LEAVING log_directory UNSET IS REQUIRED, NOT COSMETIC.
#
# With log_directory/log_filename set, Pgpool-II produced NO log file at all
# (/var/log/pgpool stayed empty, the directory being writable) AND emitted nothing
# on stdout/stderr either — total silence, while the process ran and served
# queries correctly. Removing the setting restored immediate stderr logging.
#
# So in this build, setting log_directory does not move logging to a file, it
# appears to switch logging OFF. That is the worst possible failure mode for this
# component: automatic failover is a decision made in a few seconds, and a proxy
# that cannot tell you why it did or did not fail over is not doing HA, it is
# doing something that only looks like it.
#
# Docker already captures and rotates stdout/stderr, and `docker logs` survives
# the container exiting — which an in-container file does not.
#
# log_directory = '/var/log/pgpool'
# log_filename  = 'pgpool.log'
log_line_prefix = '%m [%p] %q%r@%d '
log_client_messages = on
log_server_messages = on
log_per_connection_statement = on
log_min_messages = 'info'

# ══════════════════════════════════════════════════════════════════════════════
# ══════════════════════════════════════════════════════════════════════════════
# STREAMING REPLICATION CHECK — how primary/standby is actually decided
# ══════════════════════════════════════════════════════════════════════════════
# This is what tells Pgpool-II which backend is the writer. It runs
# pg_is_in_recovery() on each node. It is NOT optional on this endpoint — see the
# warning at the top of this file.
sr_check_period = 5
sr_check_user = 'bz_admin'
sr_check_password = 'bz_admin_dev_pw'
sr_check_database = 'bzdb'
#
# NO sr_check_max_retries / sr_check_retry_delay. Those look like they should
# exist — health_check_max_retries genuinely does — but Pgpool-II 4.3.5 has no
# such SR-check settings and logs both as:
#     INFO:  unrecognized configuration parameter "sr_check_max_retries"
# The SR check simply runs every sr_check_period seconds.

# READ/WRITE SPLITTING — INTENTIONALLY OFF
#
# Pgpool-II can ALSO route SELECTs to standbys from this same endpoint, by adding
# pool_mode = statement. That is deliberately NOT done here.
#
# This endpoint is the WRITER endpoint: the application sends its DML, and its
# strongly-consistent reads, here. Spread reads have their own endpoint that does
# it better (a plain host list across every node, with no primary bookkeeping at
# all). Keeping the two jobs separate means each proxy has one thing to be right
# about, and — the reason that actually matters — the read path is not taken down
# by primary failover. A single endpoint doing both would fail over every read
# connection at the same moment it failed over every write.
#
# pool_mode stays `transaction` (set above): statement mode is required for
# per-statement read/write splitting, and would allow multi-statement
# transactions to be split, which is not wanted on a writer path.
