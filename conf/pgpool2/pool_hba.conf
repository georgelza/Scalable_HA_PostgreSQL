# bz/conf/pgpool2/pool_hba.conf — who may connect to the WRITE endpoint
#
# Same shape as PostgreSQL's pg_hba.conf, enforced by Pgpool-II before it
# authenticates against pool_passwd. Kept minimal on purpose: this endpoint is
# for the application and for operators using psql.
#
# NOTE the read endpoint (PgBouncer) has the SAME credentials — the app uses one
# role and one password for both. What stops a write on the read port is the
# forced server-side role there, not a different login.
#
# TYPE  DATABASE   USER   ADDRESS       METHOD

# local administration (psql -d pgbouncer for SHOW POOLS / SHOW NODES)
local   all        pgbouncer              trust

# every host in the compose network, any database
host    all        all       0.0.0.0/0    scram-sha-256
host    all        all       ::/0         scram-sha-256
