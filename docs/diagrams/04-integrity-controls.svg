<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:786px;height:842px;background:#FFFFFF;" width="786px" height="842px" viewBox="0 0 786 842" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="11"><text x="54.937" y="32.636" fill="#000" font-size="19" textLength="674.444" font-weight="700" font-family="Helvetica">Integrity Controls — Four Independent Locks on Data Accuracy</text></g><!--cluster C1--><g class="cluster" data-qualified-name="C1" id="ent0001" data-source-line="13"><rect x="87.75" y="55.117" width="321" height="145.59" fill="#DBEAFE" style="stroke:#000;stroke-width:1;" rx="7" ry="7"/><text x="180.318" y="70.112" fill="#000" font-size="14" textLength="135.864" font-weight="700" font-family="Helvetica">1. ONE IDENTITY,</text><text x="199.223" y="86.409" fill="#000" font-size="14" textLength="98.055" font-weight="700" font-family="Helvetica">TWO DOORS</text></g><!--cluster C2--><g class="cluster" data-qualified-name="C2" id="ent0003" data-source-line="16"><rect x="104.75" y="240.707" width="304" height="129.6" fill="#DCFCE7" style="stroke:#000;stroke-width:1;" rx="7" ry="7"/><text x="159.642" y="255.702" fill="#000" font-size="14" textLength="194.216" font-weight="700" font-family="Helvetica">2. SEPARATE GATEWAYS</text></g><!--cluster C3--><g class="cluster" data-qualified-name="C3" id="ent0005" data-source-line="19"><rect x="82.75" y="410.307" width="326" height="129.59" fill="#FEF3C7" style="stroke:#000;stroke-width:1;" rx="7" ry="7"/><text x="143.57" y="425.302" fill="#000" font-size="14" textLength="204.36" font-weight="700" font-family="Helvetica">3. DATABASE-LEVEL LOCK</text></g><!--cluster C4--><g class="cluster" data-qualified-name="C4" id="ent0007" data-source-line="22"><rect x="354.75" y="579.897" width="283" height="129.59" fill="#FCE7F3" style="stroke:#000;stroke-width:1;" rx="7" ry="7"/><text x="407.065" y="594.892" fill="#000" font-size="14" textLength="178.37" font-weight="700" font-family="Helvetica">4. AUTOMATED PROOF</text></g><!--entity C1A--><g class="entity" data-qualified-name="C1.C1A" id="ent0002" data-source-line="14"><rect x="111.88" y="114.117" width="253.739" height="62.594" fill="#FFF" style="stroke:#000;stroke-width:1;" rx="7" ry="7"/><rect x="345.619" y="119.117" width="15" height="10" fill="#FFF" style="stroke:#000;stroke-width:1;"/><rect x="343.619" y="121.117" width="4" height="2" fill="#FFF" style="stroke:#000;stroke-width:1;"/><rect x="343.619" y="125.117" width="4" height="2" fill="#FFF" style="stroke:#000;stroke-width:1;"/><text x="126.88" y="147.112" fill="#000" font-size="14" textLength="165.443" font-family="Helvetica">The same sign-in works</text><text x="126.88" y="163.409" fill="#000" font-size="14" textLength="213.739" font-family="Helvetica">for changing and for enquiring</text></g><!--entity C2A--><g class="entity" data-qualified-name="C2.C2A" id="ent0004" data-source-line="17"><rect x="128.5" y="283.707" width="236.499" height="62.594" fill="#FFF" style="stroke:#000;stroke-width:1;" rx="7" ry="7"/><rect x="344.999" y="288.707" width="15" height="10" fill="#FFF" style="stroke:#000;stroke-width:1;"/><rect x="342.999" y="290.707" width="4" height="2" fill="#FFF" style="stroke:#000;stroke-width:1;"/><rect x="342.999" y="294.707" width="4" height="2" fill="#FFF" style="stroke:#000;stroke-width:1;"/><text x="143.5" y="316.702" fill="#000" font-size="14" textLength="168.287" font-family="Helvetica">Read and change traffic</text><text x="143.5" y="332.999" fill="#000" font-size="14" textLength="196.499" font-family="Helvetica">are physically distinct paths</text></g><!--entity C3A--><g class="entity" data-qualified-name="C3.C3A" id="ent0006" data-source-line="20"><rect x="106.6" y="453.307" width="258.313" height="62.594" fill="#FFF" style="stroke:#000;stroke-width:1;" rx="7" ry="7"/><rect x="344.913" y="458.307" width="15" height="10" fill="#FFF" style="stroke:#000;stroke-width:1;"/><rect x="342.913" y="460.307" width="4" height="2" fill="#FFF" style="stroke:#000;stroke-width:1;"/><rect x="342.913" y="464.307" width="4" height="2" fill="#FFF" style="stroke:#000;stroke-width:1;"/><text x="121.6" y="486.302" fill="#000" font-size="14" textLength="163.666" font-family="Helvetica">The read path carries a</text><text x="121.6" y="502.599" fill="#000" font-size="14" textLength="218.313" font-family="Helvetica">permanently read-only identity</text></g><!--entity C4A--><g class="entity" data-qualified-name="C4.C4A" id="ent0008" data-source-line="23"><rect x="378.73" y="622.897" width="216.039" height="62.594" fill="#FFF" style="stroke:#000;stroke-width:1;" rx="7" ry="7"/><rect x="574.769" y="627.897" width="15" height="10" fill="#FFF" style="stroke:#000;stroke-width:1;"/><rect x="572.769" y="629.897" width="4" height="2" fill="#FFF" style="stroke:#000;stroke-width:1;"/><rect x="572.769" y="633.897" width="4" height="2" fill="#FFF" style="stroke:#000;stroke-width:1;"/><text x="393.73" y="655.892" fill="#000" font-size="14" textLength="176.039" font-family="Helvetica">A repeatable test asserts</text><text x="393.73" y="672.189" fill="#000" font-size="14" textLength="171.644" font-family="Helvetica">the guarantee every run</text></g><g class="entity" data-qualified-name="GMN12" id="ent0013" data-source-line="31"><path d="M11,618.357 L11,690.021 A7,7 0 0 0 18,697.021 L323.505,697.021 A7,7 0 0 0 330.505,690.021 L330.505,621.357 L320.505,611.357 L18,611.357 A7,7 0 0 0 11,618.357" style="stroke:#000;stroke-width:1;" fill="#FFFBEB"/><path d="M320.505,611.357 L320.505,617.857 A3.5,3.5 0 0 0 324.005,621.357 L330.505,621.357 L320.505,611.357" style="stroke:#000;stroke-width:1;" fill="#FFFBEB"/><text x="17" y="628.424" fill="#000" font-size="13" textLength="80.939" font-family="Helvetica">The lock sits</text><text x="102.071" y="628.424" fill="#000" font-size="13" textLength="114.747" font-weight="700" font-family="Helvetica">in the database</text><text x="216.818" y="628.424" fill="#000" font-size="13" textLength="57.637" font-family="Helvetica">, not in a</text><text x="17" y="643.557" fill="#000" font-size="13" textLength="291.059" font-family="Helvetica">configuration file. If any component above is</text><text x="17" y="658.69" fill="#000" font-size="13" textLength="298.505" font-family="Helvetica">ever misconfigured, the database still refuses</text><text x="17" y="673.823" fill="#000" font-size="13" textLength="288.971" font-family="Helvetica">the change. Controls that sit next to the risk</text><text x="17" y="688.955" fill="#000" font-size="13" textLength="107.117" font-family="Helvetica">are not controls.</text></g><g class="entity" data-qualified-name="GMN15" id="ent0016" data-source-line="39"><path d="M488.18,764.027 L488.18,820.558 A7,7 0 0 0 495.18,827.558 L764.319,827.558 A7,7 0 0 0 771.319,820.558 L771.319,767.027 L761.319,757.027 L495.18,757.027 A7,7 0 0 0 488.18,764.027" style="stroke:#000;stroke-width:1;" fill="#FDF2F8"/><path d="M761.319,757.027 L761.319,763.527 A3.5,3.5 0 0 0 764.819,767.027 L771.319,767.027 L761.319,757.027" style="stroke:#000;stroke-width:1;" fill="#FDF2F8"/><text x="494.18" y="774.094" fill="#000" font-size="13" textLength="232.743" font-family="Helvetica">Guarantees are only real if they are</text><text x="494.18" y="789.227" fill="#000" font-size="13" textLength="133.345" font-weight="700" font-family="Helvetica">tested on demand</text><text x="627.525" y="789.227" fill="#000" font-size="13" textLength="128.794" font-family="Helvetica">. A single command</text><text x="494.18" y="804.36" fill="#000" font-size="13" textLength="253.208" font-family="Helvetica">re-proves the whole set, and is treated</text><text x="494.18" y="819.493" fill="#000" font-size="13" textLength="116.238" font-family="Helvetica">as a release gate.</text></g><!--link C1 to C2--><