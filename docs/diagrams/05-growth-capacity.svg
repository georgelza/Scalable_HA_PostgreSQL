" style="stroke:#000;stroke-width:1;"/><text x="606.7" y="357.702" fill="#000" font-size="14" textLength="123.703" font-family="Helvetica">No change to any</text><text x="606.7" y="373.999" fill="#000" font-size="14" textLength="77.226" font-family="Helvetica">application</text></g><!--entity C1a--><g class="entity" data-qualified-name="T2.C1a" id="ent0008" data-source-line="24"><rect x="252.08" y="535.307" width="260.951" height="62.594" fill="#FFF" style="stroke:#000;stroke-width:1;" rx="7" ry="7"/><rect x="493.031" y="540.307" width="15" height="10" fill="#FFF" style="stroke:#000;stroke-width:1;"/><rect x="491.031" y="542.307" width="4" height="2" fill="#FFF" style="stroke:#000;stroke-width:1;"/><rect x="491.031" y="546.307" width="4" height="2" fill="#FFF" style="stroke:#000;stroke-width:1;"/><text x="267.08" y="568.302" fill="#000" font-size="14" textLength="168.506" font-family="Helvetica">Divide the business into</text><text x="267.08" y="584.599" fill="#000" font-size="14" textLength="220.951" font-family="Helvetica">independent parts by customer</text></g><!--entity C2a--><g class="entity" data-qualified-name="T2.C2a" id="ent0009" data-source-line="25"><rect x="547.76" y="535.307" width="207.583" height="62.594" fill="#FFF" style="stroke:#000;stroke-width:1;" rx="7" ry="7"/><rect x="735.343" y="540.307" width="15" height="10" fill="#FFF" style="stroke:#000;stroke-width:1;"/><rect x="733.343" y="542.307" width="4" height="2" fill="#FFF" style="stroke:#000;stroke-width:1;"/><rect x="733.343" y="546.307" width="4" height="2" fill="#FFF" style="stroke:#000;stroke-width:1;"/><text x="562.76" y="568.302" fill="#000" font-size="14" textLength="167.583" font-family="Helvetica">Each part keeps its own</text><text x="562.76" y="584.599" fill="#000" font-size="14" textLength="141.668" font-family="Helvetica">leader + own mirror</text></g><!--entity D1a--><g class="entity" data-qualified-name="T3.D1a" id="ent0011" data-source-line="29"><rect x="810.25" y="745.897" widt