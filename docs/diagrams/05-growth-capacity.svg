fill="#000" font-size="14" textLength="156.017" font-family="Helvetica">Automatic rebuild of a</text><text x="1080.54" y="1005.789" fill="#000" font-size="14" textLength="107.878" font-family="Helvetica">discarded node</text></g><g class="entity" data-qualified-name="GMN19" id="ent0020" data-source-line="43"><path d="M11,320.177 L11,391.841 A7,7 0 0 0 18,398.841 L325.104,398.841 A7,7 0 0 0 332.104,391.841 L332.104,323.177 L322.104,313.177 L18,313.177 A7,7 0 0 0 11,320.177" style="stroke:#000;stroke-width:1;" fill="#F0FDF4"/><path d="M322.104,313.177 L322.104,319.677 A3.5,3.5 0 0 0 325.604,323.177 L332.104,323.177 L322.104,313.177" style="stroke:#000;stroke-width:1;" fill="#F0FDF4"/><text x="17" y="330.244" fill="#000" font-size="13" textLength="199.596" font-weight="700" font-family="Helvetica">What scales first, and why:</text><text x="17" y="345.377" fill="#000" font-size="13" textLength="293.097" font-family="Helvetica">enquiries are cheap to add and carry no risk.</text><text x="17" y="360.51" fill="#000" font-size="13" textLength="282.261" font-family="Helvetica">Recording changes is the expensive axis —</text><text x="17" y="375.643" fill="#000" font-size="13" textLength="262.812" font-family="Helvetica">it is scaled last, by dividing the business</text><text x="17" y="390.775" fill="#000" font-size="13" textLength="300.104" font-family="Helvetica">into parts, never by making one server faster.</text></g><g class="entity" data-qualified-name="GMN22" id="ent0023" data-source-line="51"><path d="M441,756.497 L441,797.896 A7,7 0 0 0 448,804.896 L755.104,804.896 A7,7 0 0 0 762.104,797.896 L762.104,759.497 L752.104,749.497 L448,749.497 A7,7 0 0 0 441,756.497" style="stroke:#000;stroke-width:1;" fill="#FFFBEB"/><path d="M752.104,749.497 L752.104,755.997 A3.5,3.5 0 0 0 755.604,759.497 L762.104,759.497 L752.104,749.497" style="stroke:#000;stroke-width:1;" fill="#FFFBEB"/><text x="447" y="766.564" fill="#000" font-size="13" textLength="169.787" font-weight="700" font-family="Helvetica">Key business property:</text><text x="620.919" y="766.564" fill="#000" font-size="13" textLength="126.185" font-family="Helvetica">growth is bought in</text><text x="447" y="781.697" fill="#000" font-size="13" textLength="298.264" font-family="Helvetica">steps, each of which is reversible and none of</text><text x="447" y="796.83" fill="#000" font-size="13" textLength="283.372" font-family="Helvetica">which requires applications to be rewritten.</text></g><!--link T0 to T1--><g class="link" data-entity-1="ent0001" data-entity-2="ent0004" id="lnk15" data-source-line="37" data-link-type="dependency"><path d="M484.776,146.504 C484.947,146.507 485.12,146.511 485.295,146.516 C485.998,146.532 486.739,146.552 487.518,146.574 C493.753,146.754 502.419,147.129 512.92,147.906 C533.921,149.46 562.263,152.62 593.184,159.032 C655.025,171.857 727.18,197.692 771.55,249.707 C775.348,254.16 778.498,259.111 781.104,264.37 C781.266,264.699 779.267,260.52 779.426,260.851" style="stroke:#22C55E;stroke-width:1.8;" fill="none" id="T0-to-T1"/><polygon points="781.586,265.36,781.305,255.515,779.426,260.851,774.09,258.971,781.586,265.36" fill="#22C55E" style="stroke:#22C55E;stroke-width:1.8;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="761.2" y="237.774" fill="#000" font-size="13" textLength="124.941" font-family="Helvetica">read volume grows</text></g><!--link T1 to T2--><g class="link" data-entity-1="ent0004" data-entity-2="ent0007" id="lnk16" data-source-line="38" data-link-type="dependency"><path d="M790.55,412.212 C790.55,412.565 790.55,412.919 790.55,413.274 C790.55,413.984 790.55,414.697 790.55,415.415 C790.55,418.284 790.55,421.211 790.55,424.184 C790.55,436.078 790.55,448.712 790.55,461.345 C790.55,464.503 790.55,467.661 790.55,470.808 C790.55,472.381 790.55,473.951 790.55,475.518 C790.55,475.713 790.55,470.909 790.55,471.105" style="stroke:#0EA5E9;stroke-width:1.8;" fill="none" id="T1-to-T2"/><polygon points="790.55,476.105,794.55,467.105,790.55,471.105,786