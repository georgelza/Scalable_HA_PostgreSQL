<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:1325px;height:764px;background:#FFFFFF;" width="1325px" height="764px" viewBox="0 0 1325 764" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="22"><text x="340.636" y="32.636" fill="#000" font-size="19" textLength="642.567" font-weight="700" font-family="Helvetica">Two Doors, One Identity — Separating Change from Enquiry</text></g><!--cluster RW--><g class="cluster" data-qualified-name="RW" id="ent0002" data-source-line="26"><rect x="413.21" y="174.047" width="196" height="433.83" fill="#0EA5E9" style="stroke:#334155;stroke-width:1;" rx="7" ry="7"/><text x="469.304" y="187.186" fill="#0F172A" font-size="12" textLength="83.813" font-weight="700" font-family="Helvetica">WRITE PATH</text><text x="424.102" y="201.155" fill="#0F172A" font-size="12" textLength="174.217" font-weight="700" font-family="Helvetica">always the current leader</text></g><!--cluster RO--><g class="cluster" data-qualified-name="RO" id="ent0006" data-source-line="32"><rect x="806.21" y="174.047" width="235" height="250.22" fill="#16A34A" style="stroke:#334155;stroke-width:1;" rx="7" ry="7"/><text x="885.123" y="187.186" fill="#0F172A" font-size="12" textLength="77.174" font-weight="700" font-family="Helvetica">READ PATH</text><text x="823.881" y="201.155" fill="#0F172A" font-size="12" textLength="199.658" font-weight="700" font-family="Helvetica">never the leader's bottleneck</text></g><!--cluster CORE--><g class="cluster" data-qualified-name="CORE" id="ent0009" data-source-line="37"><rect x="641.21" y="496.267" width="206" height="254.22" fill="#F1F5F9" style="stroke:#334155;stroke-width:1;" rx="7" ry="7"/><text x="705.538" y="509.406" fill="#0F172A" font-size="12" textLength="77.344" font-weight="700" font-family="Helvetica">DATA CORE</text></g><!--entity GATE--><g class="entity" data-qualified-name="RW.GATE" id="ent0003" data-source-line="27"><rect x="444.09" y="228.047" width="122.231" height="55.609" fill="#38BDF8" style="stroke:#334155;stroke-width:1;" rx="7" ry="7"/><rect x="546.321" y="233.047" width="15" height="10" fill="#38BDF8" style="stroke:#334155;stroke-width:1;"/><rect x="544.321" y="235.047" width="4" height="2" fill="#38BDF8" style="stroke:#334155;stroke-width:1;"/><rect x="544.321" y="239.047" width="4" height="2" fill="#38BDF8" style="stroke:#334155;stroke-width:1;"/><text x="459.09" y="258.258" fill="#0F172A" font-size="11" textLength="82.231" font-family="Helvetica">Failover-Aware</text><text x="459.09" y="271.062" fill="#0F172A" font-size="11" textLength="81.625" font-family="Helvetica">Write Gateway</text></g><!--entity WATCH--><g class="entity" data-qualified-name="RW.WATCH" id="ent0004" data-source-line="28"><rect x="436.85" y="344.657" width="140.703" height="55.609" fill="#7DD3FC" style="stroke:#334155;stroke-width:1;" rx="7" ry="7"/><rect x="557.553" y="349.657" width="15" height="10" fill="#7DD3FC" style="stroke:#334155;stroke-width:1;"/><rect x="555.553" y="351.657" width="4" height="2" fill="#7DD3FC" style="stroke:#334155;stroke-width:1;"/><rect x="555.553" y="355.657" width="4" height="2" fill="#7DD3FC" style="stroke:#334155;stroke-width:1;"/><text x="451.85" y="374.868" fill="#0F172A" font-size="11" textLength="74.567" font-family="Helvetica">Health Watch</text><text x="451.85" y="387.672" fill="#0F172A" font-size="11" textLength="100.703" font-family="Helvetica">who is the leader?</text></g><!--entity PROMO--><g class="entity" data-qualified-name="RW.PROMO" id="ent0005" data-source-line="29"><rect x="437.3" y="528.267" width="137.818" height="55.609" fill="#BAE6FD" style="stroke:#334155;stroke-width:1;" rx="7" ry="7"/><rect x="555.118" y="533.267" width="15" height="10" fill="#BAE6FD" style="stroke:#334155;stroke-width:1;"/><rect x="553.118" y="535.267" width="4" height="2" fill="#BAE6FD" style="stroke:#334155;stroke-width:1;"/><rect x="553.118" y="539.267" width="4" height="2" fill="#BAE6FD" style="stroke:#334155;stroke-width:1;"/><text x="452.3" y="558.478" fill="#0F172A" font-size="11" textLength="97.818" font-family="Helvetica">Automatic Leader</text><text x="452.3" y="571.282" fill="#0F172A" font-size="11" textLength="56.402" font-family="Helvetica">Promotion</text></g><!--entity RB--><g class="entity" data-qualified-name="RO.RB" id="ent0007" data-source-line="33"><rect x="830.25" y="228.047" width="167.902" height="55.609" fill="#4ADE80" style="stroke:#334155;stroke-width:1;" rx="7" ry="7"/><rect x="978.152" y="233.047" width="15" height="10" fill="#4ADE80" style="stroke:#334155;stroke-width:1;"/><rect x="976.152" y="235.047" width="4" height="2" fill="#4ADE80" style="stroke:#334155;stroke-width:1;"/><rect x="976.152" y="239.047" width="4" height="2" fill="#4ADE80" style="stroke:#334155;stroke-width:1;"/><text x="845.25" y="258.258" fill="#0F172A" font-size="11" textLength="80.223" font-family="Helvetica">Read Gateway</text><text x="845.25" y="271.062" fill="#0F172A" font-size="11" textLength="127.902" font-family="Helvetica">spreads across all sites</text></g><!--entity ROID--><g class="entity" data-qualified-name="RO.ROID" id="ent0008" data-source-line="34"><rect x="835" y="344.657" width="158.417" height="55.609" fill="#86EFAC" style="stroke:#334155;stroke-width:1;" rx="7" ry="7"/><rect x="973.417" y="349.657" width="15" height="10" fill="#86EFAC" style="stroke:#334155;stroke-width:1;"/><rect x="971.417" y="351.657" width="4" height="2" fill="#86EFAC" style="stroke:#334155;stroke-width:1;"/><rect x="971.417" y="355.657" width="4" height="2" fill="#86EFAC" style="stroke:#334155;stroke-width:1;"/><text x="850" y="374.868" fill="#0F172A" font-size="11" textLength="70.018" font-family="Helvetica">Safe Identity</text><text x="850" y="387.672" fill="#0F172A" font-size="11" textLength="118.417" font-family="Helvetica">perpetually read-only</text></g><!--entity P--><g class="entity" data-qualified-name="CORE.P" id="ent0010" data-source-line="38"><rect x="662.4" y="528.267" width="121.608" height="55.609" fill="#6366F1" style="stroke:#334155;stroke-width:1;" rx="7" ry="7"/><rect x="764.008" y="533.267" width="15" height="10" fill="#6366F1" style="stroke:#334155;stroke-width:1;"/><rect x="762.008" y="535.267" width="4" height="2" fill="#6366F1" style="stroke:#334155;stroke-width:1;"/><rect x="762.008" y="539.267" width="4" height="2" fill="#6366F1" style="stroke:#334155;stroke-width:1;"/><text x="677.4" y="558.478" fill="#0F172A" font-size="11" textLength="48.898" font-family="Helvetica">PRIMARY</text><text x="677.4" y="571.282" fill="#0F172A" font-size="11" textLength="81.608" font-family="Helvetica">holds the truth</text></g><!--entity S--><g class="entity" data-qualified-name="CORE.S" id="ent0011" data-source-line="39"><rect x="657.1" y="678.877" width="174.218" height="55.609" fill="#A5B4FC" style="stroke:#334155;stroke-width:1;" rx="7" ry="7"/><rect x="811.318" y="683.877" width="15" height="10" fill="#A5B4FC" style="stroke:#334155;stroke-width:1;"/><rect x="809.318" y="685.877" width="4" height="2" fill="#A5B4FC" style="stroke:#334155;stroke-width:1;"/><rect x="809.318" y="689.877" width="4" height="2" fill="#A5B4FC" style="stroke:#334155;stroke-width:1;"/><text x="672.1" y="709.088" fill="#0F172A" font-size="11" textLength="52.191" font-family="Helvetica">STANDBY</text><text x="672.1" y="721.892" fill="#0F172A" font-size="11" textLength="134.218" font-family="Helvetica">live mirror, serves reads</text></g><!--entity CLIENT--><g class="entity" data-qualified-name="CLIENT" id="ent0001" data-source-line="24"><rect x="491.82" y="55.117" width="218.779" height="47.938" fill="#E2E8F0" style="stroke:#334155;stroke-width:1;" rx="7" ry="7"/><text x="501.82" y="76.256" fill="#0F172A" font-size="12" textLength="106.371" font-weight="700" font-family="Helvetica">Any Application</text><text x="501.82" y="90.225" fill="#0F172A" font-size="12" textLength="198.779" font-weight="700" font-family="Helvetica">one username, one password</text></g><g class="entity" data-qualified-name="GMN23" id="ent0024" data-source-line="56"><path d="M11,235.157 L11,276.556 A7,7 0 0 0 18,283.556 L382.411,283.556 A7,7 0 0 0 389.411,276.556 L389.411,238.157 L379.411,228.157 L18,228.157 A7,7 0 0 0 11,235.157" style="stroke:#000;stroke-width:1;" fill="#FFF"/><path d="M379.411,228.157 L379.411,234.657 A3.5,3.5 0 0 0 382.911,238.157 L389.411,238.157 L379.411,228.157" style="stroke:#000;stroke-width:1;" fill="#FFF"/><text x="17" y="245.224" fill="#000" font-size="13" textLength="131.695" font-weight="700" font-family="Helvetica">Why this matters:</text><text x="152.827" y="245.224" fill="#000" font-size="13" textLength="221.362" font-family="Helvetica">the application never has to know</text><text x="17" y="260.357" fill="#000" font-size="13" textLength="42.682" font-weight="700" font-family="Helvetica">which</text><text x="63.814" y="260.357" fill="#000" font-size="13" textLength="310.597" font-family="Helvetica">server is in charge. It asks the same door every</text><text x="17" y="275.49" fill="#000" font-size="13" textLength="277.729" font-family="Helvetica">time, so no integration can be built wrong.</text></g><g class="entity" data-qualified-name="GMN26" id="ent0027" data-source-line="62"><path d="M863.23,535.377 L863.23,576.776 A7,7 0 0 0 870.23,583.776 L1182.171,583.776 A7,7 0 0 0 1189.171,576.776 L1189.171,538.377 L1179.171,528.377 L1013.51,528.377 L930.97,400.657 L1005.51,528.377 L870.23,528.377 A7,7 0 0 0 863.23,535.377" style="stroke:#000;stroke-width:1;" fill="#FFF"/><path d="M1179.171,528.377 L1179.171,534.877 A3.5,3.5 0 0 0 1182.671,538.377 L1189.171,538.377 L1179.171,528.377" style="stroke:#000;stroke-width:1;" fill="#FFF"/><text x="869.23" y="545.444" fill="#000" font-size="13" textLength="304.941" font-family="Helvetica">Safety does not rely on the gateway behaving.</text><text x="869.23" y="560.577" fill="#000" font-size="13" textLength="286.755" font-family="Helvetica">The database itself refuses any change that</text><text x="869.23" y="575.71" fill="#000" font-size="13" textLength="197.158" font-family="Helvetica">arrives through the read door.</text></g><!--link P to S--><g class="link" data-entity-1="ent0010" data-entity-2="ent0011" id="lnk12" data-source-line="40" data-link-type="dependency"><path d="M727.06,584.327 C730.85,611.147 735.9,646.896 739.68,673.646" style="stroke:#334155;stroke-width:1.8;" fill="none" id="P-to-S"/><polygon points="740.38,678.597,743.081,669.126,739.68,673.646,735.16,670.245,740.38,678.597" fill="#334155" style="stroke:#334155;stroke-width:1.8;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="736.59" y="644.944" fill="#000" font-size="13" textLength="106.672" font-family="Helvetica">continuous copy</text></g><!--link CLIENT to RW--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk13" data-source-line="43" data-link-type="dependency"><path d="M601.21,103.287 C601.21,114.987 601.21,130.108 601.21,146.257 C601.21,154.331 601.21,162.663 601.21,170.953 C601.21,171.471 601.21,171.989 601.21,172.507 C601.21,172.765 601.21,168.024 601.21,168.283" style="stroke:#334155;stroke-width:1.8;" fill="none" id="CLIENT-to-RW"/><polygon points="601.21,173.283,605.21,164.283,601.21,168.283,597.21,164.283,601.21,173.283" fill="#334155" style="stroke:#334155;stroke-width:1.8;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="602.21" y="146.114" fill="#000" font-size="13" textLength="54.615" font-family="Helvetica">changes</text></g><!--link CLIENT to RO--><g class="link" data-entity-1="ent0001" data-entity-2="ent0006" id="lnk14" data-source-line="44" data-link-type="dependency"><path d="M710.9,87.097 C818.49,96.307 972.33,116.477 1014.21,158.047 C1018.038,161.848 1021.211,166.18 1023.832,170.854 C1024.16,171.438 1024.479,172.028 1024.79,172.622 C1024.945,172.919 102